name: Deploy to hosting

# Заливает содержимое папки site/ на хостинг по FTP.
# Секреты задаются в GitHub: Settings → Secrets and variables → Actions.
# В репозитории паролей нет и быть не должно.

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload site/ via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./site/
          # Корень сайта на этом хостинге — сам корень FTP.
          # Проверено по дереву папок: /index.html имеет ровно тот размер и
          # время, которые отдаёт nginx на ashpartners.ru, и рядом лежит
          # /crm — то есть раздача идёт из "/". Папка /ashpartners.ru/www
          # существует, но сайтом не является: первая заливка ушла туда и
          # на сайте ничего не изменилось.
          # Путь не секрет, поэтому задан прямо здесь — так его видно и
          # можно поправить без похода в настройки репозитория.
          server-dir: /
          # состояние прошлой заливки хранится на сервере,
          # поэтому каждый раз уезжают только изменённые файлы
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false
          # crm/** — CRM живёт и дорабатывается на самом хостинге, а копия
          # в репозитории может быть старее: заливка откатила бы её код
          # назад. Поэтому папка не отправляется — сайт обновляется, CRM на
          # сервере остаётся нетронутой. Чтобы заливать её вместе с сайтом,
          # убрать из списка ниже строки crm/** и crm/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            crm/**
            crm/
