name: Check live site

# Диагностика: что реально отдаёт ashpartners.ru и куда легли файлы на FTP.
# Из окружения Claude до хостинга не достучаться — шлюз не пропускает.
# Запускается только вручную, ничего не меняет и не удаляет.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Что отдаёт сайт
        run: |
          curl -sS -o page.html -D head.txt https://ashpartners.ru/
          grep -iE "^(HTTP/|last-modified|content-length)" head.txt
          echo "версия стилей:"; grep -o 'site\.css?v=[^"]*' page.html | head -1
          echo "новый фон на сайте: HTTP $(curl -s -o /dev/null -w '%{http_code}' https://ashpartners.ru/assets/faq-sasha-wide.jpg)"

      - name: Где на FTP лежит сайт
        env:
          H: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
          D: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          python3 - <<'PY'
          import ftplib, os, datetime
          h,u,p,d = os.environ['H'],os.environ['U'],os.environ['P'],os.environ['D']
          f = ftplib.FTP(h, timeout=40); f.login(u,p)
          print('домашняя папка после входа:', f.pwd())
          print('путь из секрета FTP_SERVER_DIR:', repr(d))

          def walk(path, depth=0, maxdepth=2):
              try: items = list(f.mlsd(path))
              except Exception as e:
                  print('  '*depth + f'{path} — не прочитать ({e})'); return
              for name, meta in sorted(items):
                  if name in ('.','..'): continue
                  full = path.rstrip('/') + '/' + name
                  if meta.get('type') == 'dir':
                      print('  '*depth + f'[папка] {full}')
                      if depth < maxdepth: walk(full, depth+1, maxdepth)
                  elif name in ('index.html','faq-sasha-wide.jpg','site.css'):
                      ts = meta.get('modify','?')
                      print('  '*depth + f'        {full}  {meta.get("size","?")} байт  изменён {ts}')

          print('\n─── дерево от корня FTP (2 уровня, показаны index.html и site.css):')
          walk('/', 0, 2)
          f.quit()
          PY
